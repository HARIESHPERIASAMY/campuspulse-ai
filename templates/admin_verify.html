{% extends "base.html" %}

{% block title %}Admin Verification - CampusPulse AI 360{% endblock %}

{% block guest_content %}
<div class="w-full max-w-md">
  <div class="text-center mb-6">
    <div class="inline-flex w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/30 text-amber-400 items-center justify-center mb-2">
      <i data-lucide="shield-alert" class="w-6 h-6"></i>
    </div>
    <h1 class="text-xl font-bold text-white">Admin Security Authorization</h1>
    <p class="text-xs text-slate-400 mt-1">Secondary key verification required for administrative access.</p>
  </div>

  <div class="glass-card p-6 rounded-2xl border border-slate-800 shadow-2xl">
    <form action="{{ url_for('admin_verify') }}" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Admin Verification Key</label>
        <div class="relative">
          <i data-lucide="key" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
          <input type="password" name="verification_key" required placeholder="CP_ADMIN_2026_SECURE"
                 class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg pl-9 pr-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
        </div>
        <p class="text-[11px] text-slate-500 mt-1">Development Placeholder: <code class="text-amber-400">CP_ADMIN_2026_SECURE</code></p>
      </div>

      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2">
        <i data-lucide="shield-check" class="w-4 h-4"></i> Verify Key & Unlock Admin Workspace
      </button>
    </form>
  </div>
</div>
{% endblock %}
