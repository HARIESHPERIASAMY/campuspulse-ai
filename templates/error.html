{% extends "base.html" %}

{% block title %}Error {{ code }} - CampusPulse AI 360{% endblock %}

{% block guest_content %}
<div class="text-center space-y-4 max-w-md">
  <div class="inline-flex p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400">
    <i data-lucide="alert-triangle" class="w-10 h-10"></i>
  </div>
  <h1 class="text-3xl font-extrabold text-white">Error {{ code }}</h1>
  <p class="text-sm text-slate-400">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="inline-block px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition shadow-lg shadow-indigo-600/30">
    Return to Portal
  </a>
</div>
{% endblock %}

{% block content %}
<div class="text-center space-y-4 max-w-md mx-auto py-16">
  <div class="inline-flex p-4 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400">
    <i data-lucide="alert-triangle" class="w-10 h-10"></i>
  </div>
  <h1 class="text-3xl font-extrabold text-white">Error {{ code }}</h1>
  <p class="text-sm text-slate-400">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="inline-block px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition shadow-lg shadow-indigo-600/30">
    Return to Portal
  </a>
</div>
{% endblock %}
